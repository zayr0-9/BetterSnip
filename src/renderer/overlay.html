<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snip</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; cursor:crosshair; user-select:none; }
    #shade { position:fixed; inset:0; z-index:1; background:rgba(0,0,0,.35); }
    #box { position:fixed; z-index:2; border:2px solid #38bdf8; background:rgba(56,189,248,.12); display:none; box-shadow:0 0 0 99999px rgba(0,0,0,.28); pointer-events:none; }
    #box.video-ready { z-index:10; border:2px dashed #ef4444; background:transparent; box-shadow:none; }
    #hint { position:fixed; z-index:20; top:16px; left:50%; transform:translateX(-50%); }
    #modebar { position:fixed; z-index:20; top:16px; left:16px; }
    #recordControls { position:fixed; z-index:30; display:none; transform:translate(-50%,-100%); }
  </style>
</head>
<body>
  <div id="shade"></div>
  <div id="box"></div>
  <div id="modebar" class="rounded bg-zinc-950/85 text-white p-1 text-sm">
    <button id="imageMode" class="rounded px-3 py-1 bg-sky-600">Image</button>
    <button id="videoMode" class="rounded px-3 py-1 hover:bg-white/15">Video</button>
  </div>
  <div id="hint" class="rounded bg-zinc-950/80 text-white px-4 py-2 text-sm">Choose image or video, then drag to select. Esc cancels.</div>
  <div id="recordControls" class="rounded-full bg-zinc-950/90 text-white px-2 py-1 shadow-lg">
    <button id="recordBtn" title="Record" class="rounded-full px-3 py-2 text-red-400 hover:bg-white/15">●</button>
    <button id="stopBtn" title="Stop" class="rounded-full px-3 py-2 text-white/40" disabled>■</button>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
