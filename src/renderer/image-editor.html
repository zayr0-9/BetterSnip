<section id="imageView" class="hidden min-h-0 flex-1 flex-col bg-slate-950">
  <div class="shrink-0 flex flex-wrap items-center gap-3 border-b border-white/10 bg-slate-900/80 px-4 py-3">
    <label class="flex items-center gap-2 text-sm">Color <input id="color" type="color" value="#ff3333" class="h-8 w-10 rounded bg-transparent"></label>
    <label class="flex items-center gap-2 text-sm">Thickness <input id="width" type="range" min="2" max="40" value="8"><span id="widthLabel" class="w-7">8</span></label>
    <button id="undo" class="rounded-xl bg-white/10 hover:bg-white/20 px-4 py-2 text-sm font-medium">Undo</button>
    <button id="clear" class="rounded-xl bg-white/10 hover:bg-white/20 px-4 py-2 text-sm font-medium">Clear</button>
    <div class="grow"></div>
    <button id="discard" class="rounded-xl bg-white/10 hover:bg-white/20 px-4 py-2 text-sm font-medium">Discard</button>
    <button id="saveCopy" class="rounded-xl bg-white/10 hover:bg-white/20 px-4 py-2 text-sm font-semibold">Save copy</button>
    <button id="save" class="rounded-xl bg-blue-600 hover:bg-blue-700 px-5 py-2 text-sm font-semibold">Save</button>
  </div>
  <main class="canvas-wrap min-h-0 flex-1 overflow-auto grid place-items-center p-5">
    <canvas id="canvas"></canvas>
  </main>
</section>
