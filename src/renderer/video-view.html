<section id="videoView" class="hidden min-h-0 flex-1 flex-col bg-slate-950">
  <div class="shrink-0 flex items-center gap-3 border-b border-white/10 bg-slate-900/80 px-4 py-3">
    <div class="text-sm font-semibold">Video preview</div>
    <div class="grow"></div>
    <button id="openVideoFile" class="rounded-xl bg-white/10 hover:bg-white/20 px-4 py-2 text-sm font-medium">Open file</button>
    <button id="closeVideo" class="rounded-xl bg-blue-600 hover:bg-blue-700 px-5 py-2 text-sm font-semibold">Done</button>
  </div>
  <main class="min-h-0 flex-1 grid place-items-center p-5">
    <video id="videoPlayer" class="max-h-full max-w-full rounded-xl shadow-2xl" controls autoplay></video>
  </main>
</section>
