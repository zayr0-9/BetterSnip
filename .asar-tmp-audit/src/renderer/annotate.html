<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../node_modules/fabric/dist/index.min.js"></script>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; }
    .drag-region { -webkit-app-region: drag; }
    .no-drag { -webkit-app-region: no-drag; }
    .canvas-wrap .canvas-container { margin: auto; }
    .canvas-wrap canvas { border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  </style>
</head>
<body class="h-screen bg-slate-950 text-white flex flex-col">
  <header class="drag-region h-12 shrink-0 flex items-center justify-between border-b border-white/10 bg-slate-900 px-4">
    <div id="editorTitle" class="font-semibold truncate">Edit capture</div>
    <div class="no-drag flex items-center gap-2">
      <button id="minimize" class="rounded-lg px-3 py-1 hover:bg-white/10">–</button>
      <button id="close" class="rounded-lg px-3 py-1 hover:bg-red-500/80">×</button>
    </div>
  </header>

  <div id="imageMount" class="contents"></div>
  <div id="videoMount" class="contents"></div>

  <script src="annotate.js"></script>
</body>
</html>
