<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recording</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent; }
    body { user-select:none; }
    #controls { position:absolute; top:4px; left:50%; transform:translateX(-50%); z-index:5; }
    #border { position:absolute; left:0; right:0; bottom:0; top:52px; border:2px dashed #ef4444; pointer-events:none; }
    #preview { position:absolute; left:-10000px; top:-10000px; width:1px; height:1px; opacity:0; }
  </style>
</head>
<body>
  <div id="controls" class="flex items-center gap-2 rounded-full bg-zinc-950/90 px-3 py-2 text-white shadow-lg">
    <span class="h-2.5 w-2.5 animate-pulse rounded-full bg-red-500"></span>
    <button id="stop" title="Stop" class="rounded-full px-3 py-1 text-lg leading-none hover:bg-white/15">■</button>
    <span id="timer" class="min-w-12 text-xs font-semibold">00:00</span>
  </div>
  <video id="preview" muted autoplay></video>
  <div id="border"></div>
  <script src="recorder.js"></script>
</body>
</html>
